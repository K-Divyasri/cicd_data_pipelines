version: 2

models:
  - name: stg_sales
    description: "Typed, lightly cleaned sales rows. One row per order."
    columns:
      - name: order_id
        description: "Business key."
        data_tests:
          - not_null
          - unique
      - name: revenue
        description: "quantity * price."
        data_tests:
          - not_null
      - name: product
        description: "Product name."
        data_tests:
          # accepted_values is a built-in test: fail if any value is outside this list
          - accepted_values:
              values: ["Widget", "Gadget", "Sprocket", "Cog", "Gizmo"]
