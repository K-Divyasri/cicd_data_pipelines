version: 2

# A "source" tells dbt about a raw table that something OUTSIDE dbt created — here,
# the raw_sales table that pipeline/etl.py loaded into DuckDB. Declaring it lets us
# reference it as source('raw', 'raw_sales') and test it.
sources:
  - name: raw
    schema: main          # DuckDB's default schema
    tables:
      - name: raw_sales
        description: "Cleaned sales rows loaded by the Python ETL (one row per order)."
        columns:
          - name: order_id
            description: "Business key for an order."
            data_tests:
              - not_null
              - unique
